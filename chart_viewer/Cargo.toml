[package]
name = "chart_viewer"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "DuckDB extension for interactive chart visualization using Iced"
license = "MIT"
repository = "https://github.com/your_username/chart_viewer"

[lib]
crate-type = ["cdylib"]

[dependencies]
# DuckDB C API bindings
libduckdb-sys = "1.0"

# GUI framework
iced = { version = "0.13", features = ["canvas"] }

# JSON parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true